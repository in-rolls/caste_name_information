[project]
name = "last-name-basis"
version = "1.0.1"
description = "How much does an Indian last name tell you about caste?"
requires-python = ">=3.11"
dependencies = [
    "outkast>=2.0.1",
    "pandas>=2.2",
    "pyarrow>=18,!=19.0.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "rapidfuzz>=3.14",
]

[project.optional-dependencies]
# instate supplies electoral-roll surname frequencies. Analysis 01 runs without
# it and reports the frequency-weighted figures as unavailable.
rolls = ["instate>=3.0.0"]
dev = ["pytest", "black", "isort", "flake8", "jupyter", "nbformat", "nbconvert"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.pdf,*.png,*.jpg,*.jpeg,*.gif,*.csv,*.tsv,*.json,*.geojson,*.graphml,*.ipynb,*.html,*.svg,*.bib,*.bbl,*.lock,*.parquet,*.rda,*.rds,*.RData,*.dta,*.xlsx,*.xml,*.min.js,*.map,*.log,*.aux"
ignore-words-list = "artefact,colour,colours,generalises,grey,labelled,memorisation,memorised,memorises,memorising,neighbour,neighbours,normalisation,normalise,randomised,recognised"
